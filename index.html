*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: rgb(10,10,20);

  --s2: #181836;
  --line: #20203c;

  --text: #eeeef6;
  --text2: #a8a8c4;
  --text3: #7c7c9c;
  --acc: #aab6ff;
  --acc-bg: rgba(170,182,255,.1);
  --warm: #ffb45e;
  --ok: #6fdcaf;
  --hot: #ff7d8e;
  --f: 1;
  --pad: 20px;
  --ease: cubic-bezier(.16,1,.3,1);

}
html { background: var(--bg); scroll-behavior: smooth; scroll-padding-top: 12px; }
body {

  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Hiragino Sans", "Noto Sans TC", sans-serif;

  line-height: 1.6;
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: calc(110px + env(safe-area-inset-bottom));
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
::selection { background: var(--acc); color: var(--bg); }
:focus-visible { outline: 1.5px solid var(--acc); outline-offset: 2px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

.hero { padding: calc(48px + env(safe-area-inset-top)) var(--pad) 28px; }
.hero h1 { font-weight: 200; font-size: calc(64px * var(--f)); line-height: 1.02; letter-spacing: .02em; }

.hero-meta {

  font-size: calc(12px * var(--f)); letter-spacing: .16em; color: var(--text3);
  padding-top: 12px; border-top: 1px solid var(--line2);
  font-variant-numeric: tabular-nums;
}
.hero-meta b { color: var(--text2); font-weight: 400; letter-spacing: .06em; }

/* NOW */
.now {
  margin: 0 var(--pad);
  background: var(--s1);
  border-radius: 18px;
  padding: 18px 18px 16px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
}
.now-k { grid-column: 1 / -1; font-size: calc(11px * var(--f)); letter-spacing: .2em; color: var(--hot); display: flex; align-items: center; gap: 8px; }
.now-k i { width: 6px; height: 6px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 0 0 rgba(255,125,142,.6); animation: pulse 2.4s var(--ease) infinite; }

.now-big { font-size: calc(22px * var(--f)); font-weight: 600; line-height: 1.35; margin-top: 4px; }
.now-sm { font-size: calc(13.5px * var(--f)); color: var(--text2); grid-column: 1; }
.now-go {
  grid-row: 2 / 4; grid-column: 2;
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--acc); color: var(--bg);
  display: grid; place-items: center; font-size: 20px;
}

/* ── SECTION HEAD ── */
.sh {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 52px var(--pad) 14px;
}
.sh h2 { font-size: calc(30px * var(--f)); font-weight: 200; letter-spacing: .1em; }
.sh .aside { font-size: calc(13px * var(--f)); color: var(--text3); font-variant-numeric: tabular-nums; letter-spacing: .06em; }

/* ── DAYS ── */
.day { border-top: 1px solid var(--line); }
.day:last-child { border-bottom: 1px solid var(--line); }
.day-row {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: calc(78px * var(--f)) 1fr 20px; gap: 14px;
  padding: 20px var(--pad);
  align-items: start;
}
.dr-date { font-variant-numeric: tabular-nums; line-height: 1; }
.dr-date b { display: block; font-size: calc(30px * var(--f)); font-weight: 200; letter-spacing: -.02em; }
.dr-date span { display: block; font-size: calc(11px * var(--f)); letter-spacing: .2em; color: var(--text3); margin-top: 8px; text-transform: uppercase; }
.dr-title { font-size: calc(17px * var(--f)); font-weight: 600; line-height: 1.4; }
.dr-desc { font-size: calc(13.5px * var(--f)); color: var(--text2); margin-top: 4px; line-height: 1.55; }
.dr-badge { display: inline-block; margin-top: 10px; font-size: calc(11.5px * var(--f)); color: var(--text2); border: 1px solid var(--line2); border-radius: 20px; padding: 2px 10px; }
.dr-badge.hl { color: var(--ok); border-color: rgba(111,220,175,.45); background: rgba(111,220,175,.08); }
.day-row .chev { color: var(--text3); margin-top: 8px; transition: transform .4s var(--ease); font-size: 18px; }
.day.open .day-row .chev { transform: rotate(180deg); color: var(--text); }
.day.today .dr-date b { color: var(--hot); }
.day.today .dr-date span::after { content: " · TODAY"; color: var(--hot); }

.day-body {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows .5s var(--ease);
}
.day.open .day-body { grid-template-rows: 1fr; }
.day-inner { overflow: hidden; min-height: 0; }
.day-pad { padding: 0 var(--pad) 26px; }
.day-sub {
  font-size: calc(13px * var(--f)); color: var(--text3); letter-spacing: .04em;
  padding: 10px 0 4px;
  border-top: 1px dashed var(--line2);
}
.day-sub b { color: var(--text2); font-weight: 400; }

.grp {
  display: inline-block;
  margin-top: 22px;
  font-size: calc(11.5px * var(--f)); letter-spacing: .18em;
  color: var(--bg); background: var(--text2);
  padding: 3px 10px; border-radius: 20px;
}
.sl { padding-top: 22px; }
.sl + .sl { margin-top: 0; }
.sl-t {
  display: flex; align-items: center; gap: 10px;
  font-size: calc(24px * var(--f)); font-weight: 300;
  font-variant-numeric: tabular-nums; letter-spacing: .01em;
  line-height: 1;
  color: var(--text2);
}
.sl-t::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sl.key .sl-t { color: var(--acc); font-weight: 400; }
.sl.key .sl-t::after { background: rgba(170,182,255,.25); }
.sl.next .sl-t::before { content: "NEXT"; order: 2; font-size: 10px; letter-spacing: .2em; color: var(--bg); background: var(--hot); padding: 2px 6px; border-radius: 3px; font-weight: 600; }
.sl-title { font-size: calc(17px * var(--f)); font-weight: 600; line-height: 1.45; margin-top: 10px; }
.sl-detail { font-size: calc(14.5px * var(--f)); color: var(--text2); line-height: 1.65; margin-top: 4px; }
.sl-note {

  color: var(--warm);
  margin-top: 10px;

.sl-note svg.i { margin-top: .22em; font-size: 1.05em; }
.sl-note a { text-decoration: none; border-bottom: 1px solid currentColor; }
.sl-addr a {

  font-size: calc(13.5px * var(--f)); line-height: 1.5; color: var(--text);

  background: var(--s1);

.sl-addr a:active { background: var(--s2); }
.sl-addr .pin { color: var(--acc); margin-top: .2em; }
.sl-addr .txt { flex: 1; min-width: 0; }
.sl-addr .out { color: var(--text3); margin-top: .2em; }

/* ── PREP ── */
.prep { padding: 0 var(--pad); }
.pg-t {

.pg-t:first-child { margin-top: 0; }
.pg-t .cnt { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.cnt.done, .aside.done { color: var(--ok); }
.pi {

.pi:active { opacity: .7; }
.box {

.pi-sub a { text-decoration: none; border-bottom: 1px solid var(--line2); }
.pi.checked .pi-title { color: var(--text3); text-decoration: line-through; }

/* ── NOTES ── */
.notes { padding: 0 var(--pad); counter-reset: n; }
.nt { padding: 22px 0; border-top: 1px solid var(--line); }

.nt h3::before { counter-increment: n; content: counter(n, decimal-leading-zero); font-size: calc(12px * var(--f)); color: var(--text3); font-weight: 400; font-variant-numeric: tabular-nums; }
.nt-body { font-size: calc(14.5px * var(--f)); color: var(--text2); line-height: 1.8; }
.nt-body b { color: var(--text); font-weight: 600; }

/* ── DOCK ── */
.dock {

  left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom));
  width: min(calc(100% - 28px), 452px);
  display: flex; align-items: center;
  padding: 5px;
  border-radius: 999px;
  background: rgba(24,24,54,.82);

  box-shadow: 0 10px 30px -8px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.06);

.dock button {

  font-size: calc(13.5px * var(--f)); letter-spacing: .12em; color: var(--text2);

.dock button.on { background: var(--text); color: var(--bg); font-weight: 600; }
.dock .font-btn { flex: none; width: 44px; letter-spacing: 0; font-size: 15px; }
.dock .font-btn.active { color: var(--acc); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }

</style>

ss 不覆蓋的近鉄、大阪地下鐵、巴士使用 · 建議充值 ¥5,000"}, {"id": "c11", "title": "薄外套 + 折傘", "urgent": false, "sub": "金澤 10 月均溫 12–18°C，早晚涼 · 金澤多陰雨天氣"}]}, {"title": "已預訂", "items": [{"id": "b1", "title": "機票 — IT252 / BR129", "urgent": false, "sub": "去程 10/29 IT252 桃園 11:50 → 小松 15:35 · 回程 11/4 BR129 關西 18:30 → 桃園 20:30"}, {"id": "b2", "title": "機場接送（台中 ⇄ 桃園）", "urgent": false, "sub": "去程 10/29 07:20 北屯總站 · D3888389<br/>回程 11/4 20:30 桃園 · D3888343"}, {"id": "b3", "title": "JR Pass 關西・北陸地區周遊券", "urgent": false, "sub": "10/29 金澤站（金沢駅 Kanazawa）みどりの窓口換領 · 7 日 10/29–11/4"}, {"id": "b4", "title": "APA Hotel Kanazawa Ekimae", "urgent": false, "sub": "10/29–10/31 · 石川県金沢市広岡 2-13-1"}, {"id": "b5", "title": "APA Hotel なんば駅東", "urgent": false, "sub": "10/31–11/4 · 大阪府大阪市中央区難波千日前 4-29 · Check-in 15:00 / Check-out 10:00"}, {"id": "b6", "title": "焼肉 大判 金沢駅前店", "urgent": false, "sub": "10/29 18:30"}, {"id": "b7", "title": "TeamLab 京都", "urgent": false, "sub": "11/1 09:30 入場枠 · QR 碼事先截圖"}, {"id": "b8", "title": "USJ 門票 + Express Pass 4 ハロウィーン・セット", "urgent": false, "sub": "11/2 · 指定時段 12:00 ファクトリー・オブ・フィアー · 15:20 バイオハザード ザ・ダイブ · 不限時段 ハリー・ポッター、ジョーズ"}, {"id": "b9", "title": "ゴジラ-0.0 IMAX 最速上映", "urgent": false, "sub": "11/3 0:00（11/2 深夜）· TOHOシネマズなんば 本館"}, {"id": "b10", "title": "BooBoo キッチン", "urgent": false, "sub": "11/3 19:00 · JR 堺市站 步行 1 分"}]}], "notes": [{"title": "JR Pass 指定席劃位", "body": "<ul><li><b>10/31<\/b>　かがやき 503 號　金澤站（金沢駅 Kanazawa） 09:46 → 敦賀站（敦賀駅 Tsuruga） 10:26（全車指定席）<\/li><li><b>10/31<\/b>　サンダーバード 24 號　敦賀站（敦賀駅 Tsuruga） 14:14 → 大阪站（大阪駅 Ōsaka） 15:36<\/li><li><b>11/04<\/b>　はるか 31 號　天王寺站（天王寺駅 Tennōji） 14:17 → 關西機場站（関西空港駅 Kansai-Kūkō） 14:50（乘車站選「天王寺」）<\/li><\/ul><ul><li>其餘路段不需劃位，刷 Pass 上車：新幹線 つるぎ / はくたか（自由席）、冰見線、城端線、新快速、環状線、夢咲線、阪和線<\/li><li>用 Pass 劃指定席不另收費<\/li><li>線上劃位第 7 次起需至車站窗口辦理<\/li><\/ul>"}, {"title": "11/1 起 新免稅制度（リファンド方式）", "body": "<ul><li><b>先付含稅價，出境後退稅<\/b>：11/1 起免稅店結帳時先付含稅金額，並登記退款方式（信用卡等），出境確認後才退款<\/li><li><b>門檻<\/b>：同一店家同一天未稅滿 ¥5,000<\/li><li><b>11/4 關西機場：托運行李前<\/b>先到免稅 kiosk 刷護照做海關確認，綠燈直接報到，紅燈需出示商品給海關<\/li><li><b>免稅商品放隨身或可隨時取出<\/b>：同一張收據的商品必須全部帶齊，缺一件整張收據都不退<\/li><li>消耗品在日本境內用掉就不能退<\/li><li>購買後 90 天內須完成出境確認；退款方式與入帳時間依各店或退稅代辦業者而定<\/li><li>10/29–10/31 的購物怎麼適用，以店家說明為準<\/li><\/ul>"}, {"title": "大阪住宿 交通", "body": "<b>APA Hotel なんば駅東（アパホテル〈なんば駅東〉）<\/b><br/>大阪府大阪市中央区難波千日前 4-29<br/><br/>\n難波站（なんば駅 Namba）（Osaka Metro / 南海）1 號出口 步行 4 分 · 大阪難波站（大阪難波駅 Ōsaka-Namba）（近鉄・阪神）步行 4 分 · 日本橋站（日本橋駅 Nippombashi）5 號出口 步行 5 分<br/><br/>\n往梅田 / 大阪站：御堂筋線 約 10 分 · 往天王寺：御堂筋線 約 7 分 · 往 USJ：阪神なんば線 + JR 夢咲線<br/>\n地下鐵、阪神、近鉄皆不適用 JR Pass，請用 IC 卡。"}, {"title": "航班時刻", "body": "<b>去程 IT252<\/b>　台灣虎航　桃園 11:50 → 小松機場（小松空港 Komatsu Kūkō） 15:35（日本時間）· 飛行約 2hr45min<br/><br/>\n<b>回程 BR129<\/b>　長榮航空　關西機場（関西国際空港 Kansai Kokusai Kūkō） 18:30（日本時間）→ 桃園 20:30（台灣時間）· 飛行約 3hr<br/><br/>\n<b>機場接送 去程<\/b>　台中北屯總站 07:20 集合 → 09:20 抵桃園 · 單號 D3888389<br/>\n<b>機場接送 回程<\/b>　桃園 20:30 出境後搭車 → 約 22:30 北屯總站 · 單號 D3888343"}, {"title": "JR Pass 適用 / 不適用範圍", "body": "<b>適用：<\/b>北陸新幹線（敦賀–上越妙高）、JR 冰見線・城端線、サンダーバード、JR 京都線・嵯峨野線、JR 大阪環状線 + 夢咲線（USJ）、はるか（關西機場）<br/><br/>\n<b>不適用：<\/b>IR いしかわ鐵道（小松 Komatsu → 金沢 Kanazawa）、あいの風とやま鐵道（金沢 Kanazawa – 高岡 Takaoka）、小松機場巴士、叡山電鉄、大阪地下鐵・御堂筋線、阪急・阪神電車"}, {"title": "敦賀停留 交通整理", "body": "<b>金澤（金沢 Kanazawa）→ 敦賀（敦賀 Tsuruga）<\/b>　北陸新幹線 かがやき 503 號（JR Pass 適用）· 09:46 発 → 10:26 着 · 約 40 分<br/><br/>\n<b>敦賀（敦賀 Tsuruga）→ 大阪（大阪 Ōsaka）<\/b>　特急 サンダーバード 24 號（JR Pass 適用）· 14:14 発 → 15:36 着 · 約 1hr22min<br/><br/>\n      敦賀站（敦賀駅 Tsuruga）から気比神宮まで徒歩 10 分、赤レンガ倉庫まで徒歩 15 分。駅前は小規模な街なので移動は徒歩で十分。<br/><br/>\n      注意：10/31 は萬聖節，心齋橋夜間の人出が多いため、<b>16:15 頃<\/b>飯店 Check-in，18:00 前用完晚餐。"}, {"title": "雨晴海岸 注意事項", "body": "立山連峰能見度受天氣影響大，陰天或雨天幾乎看不到山景。JR 冰見線班次稀少（約每小時 1 班），出發前務必查好時刻表，避免錯過班車。"}, {"title": "心齋橋 / 道頓堀 萬聖節", "body": "往年實施飲酒禁止令及人行管制，禁止攜帶酒精進入管制區。人潮高峰 20:00–22:00。全程注意隨身物品安全，避免攜帶貴重品。"}, {"title": "BooBoo キッチン 位置說明", "body": "位於堺市北区，堺市站（堺市駅 Sakaishi） 步行 1 分。從難波：御堂筋線至天王寺（自費）+ JR 阪和線（JR Pass 適用），約 30 分。座位僅 13 席，週一公休。已預約 11/3 19:00。"}, {"title": "購物行李規劃", "body": "日本橋（11/3）可能購入模型或玩具，請注意 BR129 長榮航空托運限重（確認機票艙等）。大型或脆弱商品建議當日宅配至旅館或機場。"}], "tabs": ["總覽", "行程", "準備", "注意"]};
const KEY = { 0:['11:50'], 2:['09:46','14:14'], 3:['09:30'], 4:['10:00','12:00','15:20','24:00'], 5:['19:00'], 6:['14:17','18:30'] };
const YEAR = 2026;
const $ = s => document.querySelector(s);
const ico = (id, cls='') => `<svg class="i ${cls}"><use href="#i-${id}"/></svg>`;
const splitDay = t => { const m = t.match(/^(\S+)\s+(\S+)\s+·\s+(.*)$/); return { date: m[1], dow: m[2], name: m[3] }; };
const maps = a => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a.replace(/<[^>]+>/g,'').trim());

// header
$('#h1').innerHTML = D.hdr.title.split('・').map(x => `<span>${x}</span>`).join('');
$('#eyebrow').textContent = D.hdr.eyebrow;
$('#sub').innerHTML = D.hdr.sub;
$('#t-days').textContent = D.tabs[1];
$('#t-prep').textContent = D.tabs[2];
$('#t-notes').textContent = D.tabs[3];
$('#days-aside').textContent = D.days.length + ' DAYS';

// days
function part(k, h) {
  if (k === 'addr') return `<div class="sl-addr"><a href="${maps(h)}" target="_blank" rel="noopener">${ico('pin','pin')}<span class="txt">${h}</span>${ico('out','out')}</a></div>`;
  if (k === 'note') return `<div class="sl-note">${ico('alert')}<span>${h}</span></div>`;
  return `<div class="sl-${k}">${h}</div>`;
}
$('#days').innerHTML = D.days.map((d, i) => {
  const o = D.overview[i], s = splitDay(d.title), keys = KEY[i] || [];
  let body = '';
  d.groups.forEach(g => {
    if (g.label) body += `<div class="grp">${g.label}</div>`;
    g.slots.forEach(sl => body += `<div class="sl${keys.includes(sl.time)?' key':''}" data-time="${sl.time}"><div class="sl-t">${sl.time}</div>${sl.parts.map(p => part(p[0], p[1])).join('')}</div>`);
  });
  return `
  <article class="day" id="day${i}">
    <button class="day-row" aria-expanded="false">
      <div class="dr-date"><b>${o.date}</b><span>${o.dow}</span></div>
      <div>
        <div class="dr-title">${o.title}</div>
        <div class="dr-desc">${o.desc}</div>
        ${o.badge ? `<span class="dr-badge${o.gold?' hl':''}">${o.badge}</span>` : ''}
      </div>
      ${ico('down','chev')}
    </button>
    <div class="day-body"><div class="day-inner"><div class="day-pad">
      <div class="day-sub"><b>${s.name}</b> · ${d.sub}</div>
      ${body}
    </div></div></div>
  </article>`;
}).join('');
function setOpen(el, on) { el.classList.toggle('open', on); el.querySelector('.day-row').setAttribute('aria-expanded', on); }
document.querySelectorAll('.day').forEach(el => el.querySelector('.day-row').onclick = () => setOpen(el, !el.classList.contains('open')));

// now (Japan time)
const jst = new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000);
const dayDate = i => { const [m, d] = splitDay(D.days[i].title).date.split('/').map(Number); return new Date(YEAR, m - 1, d); };
const today0 = new Date(jst.getFullYear(), jst.getMonth(), jst.getDate());
const idx = D.days.findIndex((_, i) => dayDate(i).getTime() === today0.getTime());
const first = D.days[0].groups[0].slots[0];
let nowHTML;
if (idx >= 0) {
  const el = $('#day' + idx); el.classList.add('today'); setOpen(el, true);
  const mins = jst.getHours() * 60 + jst.getMinutes();
  const next = [...el.querySelectorAll('.sl')].find(s => { const m = s.dataset.time.match(/^(\d\d):(\d\d)$/); return m && (+m[1] * 60 + +m[2]) >= mins; });
  if (next) next.classList.add('next');
  const o = D.overview[idx];
  nowHTML = `<div class="now-k"><i></i>TODAY · ${o.date} ${o.dow}</div>
    <div class="now-big">${next ? next.dataset.time + '　' + next.querySelector('.sl-title').textContent : o.title}</div>
    <div class="now-sm">${o.title}</div>
    <button class="now-go" data-to="${next ? '' : 'day' + idx}" aria-label="前往">${ico('arrow')}</button>`;
  var nowTarget = next || el;
} else if (today0 < dayDate(0)) {
  const n = Math.round((dayDate(0) - today0) / 864e5);
  setOpen($('#day0'), true);
  nowHTML = `<div class="now-k"><i></i>出發倒數</div>
    <div class="now-big">${n} 天</div>
    <div class="now-sm">${D.overview[0].date} ${first.time} · ${first.parts[0][1]}</div>
    <button class="now-go" aria-label="前往">${ico('arrow')}</button>`;
  var nowTarget = $('#day0');
} else {
  nowHTML = `<div class="now-k"><i></i>${D.hdr.sub}</div><div class="now-big">${D.hdr.title}</div><div class="now-sm">${D.overview.at(-1).title}</div><button class="now-go" aria-label="前往">${ico('arrow')}</button>`;
  var nowTarget = $('#s-days');
}
$('#now').innerHTML = nowHTML;
$('#now .now-go').onclick = () => nowTarget.scrollIntoView({ behavior: 'smooth', block: 'start' });

// prep
const STORE = 'itinerary_checks';
const CHECK = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';
const load = () => { try { return JSON.parse(localStorage.getItem(STORE) || '{}'); } catch(e) { return {}; } };
const saved = load();
$('#prep').innerHTML = D.prep.map(g => `
  <div class="pg"><div class="pg-t"><span>${g.title}</span><span class="cnt"></span></div>
  ${g.items.map(it => `
    <div class="pi${saved[it.id]?' checked':''}" id="${it.id}" role="checkbox" tabindex="0">
      <div class="box">${CHECK}</div>
      <div><div class="pi-title${it.urgent?' urgent':''}">${it.title}</div><div class="pi-sub">${it.sub}</div></div>
    </div>`).join('')}</div>`).join('');
function counts() {
  let a = 0, c = 0;
  document.querySelectorAll('.pg').forEach(g => {
    const ga = g.querySelectorAll('.pi').length, gc = g.querySelectorAll('.pi.checked').length;
    a += ga; c += gc; const ce = g.querySelector('.cnt'); ce.textContent = gc + ' / ' + ga; ce.classList.toggle('done', gc === ga);
  });
  $('#prep-aside').textContent = c + ' / ' + a; $('#prep-aside').classList.toggle('done', c === a);
  document.querySelectorAll('.pi').forEach(p => p.setAttribute('aria-checked', p.classList.contains('checked')));
}
function toggle(el) {
  el.classList.toggle('checked');
  const s = load(); s[el.id] = el.classList.contains('checked');
  try { localStorage.setItem(STORE, JSON.stringify(s)); } catch(e) {}
  counts();
}
document.querySelectorAll('.pi').forEach(p => {
  p.onclick = e => { if (!e.target.closest('a')) toggle(p); };
  p.onkeydown = e => { if (e.key===' '||e.key==='Enter') { e.preventDefault(); toggle(p); } };
});
counts();

// notes
$('#notes').innerHTML = D.notes.map(n => `<div class="nt"><h3>${n.title}</h3><div class="nt-body">${n.body}</div></div>`).join('');

// dock
const TARGETS = ['top', 's-days', 's-prep', 's-notes'];
$('#dock').innerHTML = D.tabs.map((t, i) => `<button data-to="${TARGETS[i]}"${i?'':' class="on"'}>${t}</button>`).join('') + `<button class="font-btn" id="fontBtn" aria-label="字級">A</button>`;
document.querySelectorAll('.dock [data-to]').forEach(b => b.onclick = () => document.getElementById(b.dataset.to).scrollIntoView({ behavior: 'smooth', block: 'start' }));
const spy = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) document.querySelectorAll('.dock [data-to]').forEach(b => b.classList.toggle('on', b.dataset.to === e.target.id));
}), { rootMargin: '-45% 0px -50% 0px' });
TARGETS.forEach(t => spy.observe(document.getElementById(t)));

// font
const SC = [1, 1.15, 1.3, 1.45], LB = ['A', 'A⁺', 'A⁺⁺', 'A⁺⁺⁺'];
let fl = 0;
function font(l) { fl = l; document.documentElement.style.setProperty('--f', SC[l]); $('#fontBtn').textContent = LB[l]; $('#fontBtn').classList.toggle('active', l > 0); }
$('#fontBtn').onclick = () => { font((fl + 1) % SC.length); try { localStorage.setItem('itinerary_font', fl); } catch(e) {} };
try { const f = parseInt(localStorage.getItem('itinerary_font') || '0'); if (f > 0 && f < SC.length) font(f); } catch(e) {}
</script>
</body>
</html>
